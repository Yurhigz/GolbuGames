<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>WebSocket Chat</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
    }
    .controls {
      margin-bottom: 10px;
    }
    button {
      padding: 6px 12px;
      margin: 0 4px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      color: white;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    #connectBtn { background: #28a745; }
    #disconnectBtn { background: #dc3545; }
    #sendBtn { background: #007bff; }
    .chat {
      display: none;
      flex-direction: column;
      width: 100%;
      max-width: 500px;
      background: white;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      padding: 10px;
      flex: 1;
    }
    .messages {
      flex: 1;
      overflow-y: auto;
      margin-bottom: 10px;
    }
    .msg {
      margin: 4px 0;
      padding: 6px 8px;
      border-radius: 4px;
    }
    .system { background: #e0e0e0; text-align: center; font-size: 0.9em; }
    .me { background: #cce5ff; align-self: flex-end; }
    .other { background: #d4edda; align-self: flex-start; }
    .input-area {
      display: flex;
      gap: 6px;
    }
    input[type="text"] {
      flex: 1;
      padding: 6px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="controls">
    <button id="connectBtn">Connect</button>
    <button id="disconnectBtn" disabled>Disconnect</button>
  </div>

  <div class="chat" id="chatBox">
    <div class="messages" id="messages"></div>
    <div class="input-area">
      <input type="text" id="msgInput" placeholder="Type a message..." />
      <button id="sendBtn">Send</button>
    </div>
  </div>

  <script>
    let ws = null;

    const connectBtn = document.getElementById("connectBtn");
    const disconnectBtn = document.getElementById("disconnectBtn");
    const chatBox = document.getElementById("chatBox");
    const messagesDiv = document.getElementById("messages");
    const msgInput = document.getElementById("msgInput");
    const sendBtn = document.getElementById("sendBtn");

    function addMessage(text, type = "system", sender = null) {
      const div = document.createElement("div");
      div.className = `msg ${type}`;
      div.textContent = sender ? sender + ": " + text : text;
      messagesDiv.appendChild(div);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    connectBtn.onclick = () => {
      if (ws) return;
      ws = new WebSocket("ws://localhost:3005/ws"); // 🔧 adapte l'URL selon ton serveur

      ws.onopen = () => {
        addMessage("✅ Connected to server");
        connectBtn.disabled = true;
        disconnectBtn.disabled = false;
        chatBox.style.display = "flex";
      };

      ws.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);
          if (msg.type === "chat") {
            addMessage(msg.message, msg.sender === "Me" ? "me" : "other", msg.sender);
          } else {
            addMessage(msg.message || event.data, "system");
          }
        } catch {
          addMessage(event.data, "system");
        }
      };

      ws.onclose = () => {
        addMessage("❌ Disconnected");
        connectBtn.disabled = false;
        disconnectBtn.disabled = true;
        chatBox.style.display = "none";
        ws = null;
      };
    };

    disconnectBtn.onclick = () => {
      if (ws) ws.close();
    };

    sendBtn.onclick = () => {
      const text = msgInput.value.trim();
      if (ws && text) {
        const msg = { type: "chat", sender: "Me", message: text };
        ws.send(JSON.stringify(msg));
        addMessage(text, "me", "Me");
        msgInput.value = "";
      }
    };

    msgInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendBtn.click();
    });
  </script>
</body>
</html>
