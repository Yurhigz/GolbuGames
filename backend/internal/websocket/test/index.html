<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>WebSocket Connect/Disconnect</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
    }
    .controls {
      margin-bottom: 10px;
    }
    button {
      padding: 6px 12px;
      margin: 0 4px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      color: white;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    #connectBtn { background: #28a745; }
    #disconnectBtn { background: #dc3545; }
    #sendBtn { background: #007bff; }
    
    .input-section {
      margin: 10px 0;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    
    input[type="text"] {
      padding: 6px 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      width: 200px;
    }
    
    .log {
      margin-top: 20px;
      width: 100%;
      max-width: 600px;
      background: white;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      padding: 10px;
      max-height: 400px;
      overflow-y: auto;
    }
    .entry {
      margin: 4px 0;
      padding: 6px 8px;
      border-radius: 4px;
      background: #e0e0e0;
      font-size: 0.9em;
    }
    .entry.connected { background: #d4edda; }
    .entry.disconnected { background: #f8d7da; }
    .entry.message { background: #d1ecf1; }
    .entry.error { background: #f5c6cb; }
  </style>
</head>
<body>
  <div class="controls">
    <button id="connectBtn">Connect</button>
    <button id="disconnectBtn" disabled>Disconnect</button>
  </div>
  
  <div class="input-section">
    <input type="text" id="messageInput" placeholder="Type a message..." disabled>
    <button id="sendBtn" disabled>Send Message</button>
  </div>
  
  <div class="log" id="logBox"></div>
  
  <script>
    let ws = null;
    let pingInterval = null;
    
    const connectBtn = document.getElementById("connectBtn");
    const disconnectBtn = document.getElementById("disconnectBtn");
    const sendBtn = document.getElementById("sendBtn");
    const messageInput = document.getElementById("messageInput");
    const logBox = document.getElementById("logBox");
    
    function addLog(text, type = 'default') {
      const div = document.createElement("div");
      div.className = `entry ${type}`;
      div.textContent = `${new Date().toLocaleTimeString()} - ${text}`;
      logBox.appendChild(div);
      logBox.scrollTop = logBox.scrollHeight;
    }
    
    function enableControls(connected) {
      connectBtn.disabled = connected;
      disconnectBtn.disabled = !connected;
      sendBtn.disabled = !connected;
      messageInput.disabled = !connected;
    }
    
    function startPing() {
      // Envoyer un ping toutes les 30 secondes pour maintenir la connexion
      pingInterval = setInterval(() => {
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: 'ping' }));
          addLog("Sent ping", 'message');
        }
      }, 30000);
    }
    
    function stopPing() {
      if (pingInterval) {
        clearInterval(pingInterval);
        pingInterval = null;
      }
    }
    
    connectBtn.onclick = () => {
      if (ws) return;
      
      addLog("Connecting to ws://localhost:3005/ws...");
      ws = new WebSocket("ws://localhost:3005/ws");
      
      ws.onopen = (event) => {
        addLog("✅ Connected to server", 'connected');
        enableControls(true);
        startPing();
        
        // Envoyer un message initial pour tester
        ws.send(JSON.stringify({ 
          type: 'system', 
          message: 'Client connected and ready' 
        }));
      };
      
      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          addLog(`📨 Received: ${JSON.stringify(data)}`, 'message');
        } catch (e) {
          // Si ce n'est pas du JSON, afficher tel quel
          addLog(`📨 Received: ${event.data}`, 'message');
        }
      };
      
      ws.onclose = (event) => {
        addLog(`❌ Disconnected (Code: ${event.code}, Reason: ${event.reason || 'No reason'})`, 'disconnected');
        enableControls(false);
        stopPing();
        ws = null;
      };
      
      ws.onerror = (error) => {
        addLog(`⚠️ WebSocket error: ${error.message || 'Unknown error'}`, 'error');
        console.error('WebSocket error:', error);
      };
    };
    
    disconnectBtn.onclick = () => {
      if (ws) {
        addLog("Closing connection...");
        ws.close(1000, "User requested disconnect");
      }
    };
    
    sendBtn.onclick = () => {
      const message = messageInput.value.trim();
      if (message && ws && ws.readyState === WebSocket.OPEN) {
        const payload = {
          type: 'chat',
          message: message,
          timestamp: Date.now()
        };
        ws.send(JSON.stringify(payload));
        addLog(`📤 Sent: ${message}`, 'message');
        messageInput.value = '';
      }
    };
    
    messageInput.onkeypress = (e) => {
      if (e.key === 'Enter') {
        sendBtn.click();
      }
    };
    
    // Nettoyage lors de la fermeture de la page
    window.addEventListener('beforeunload', () => {
      if (ws) {
        ws.close();
      }
      stopPing();
    });
  </script>
</body>
</html>
